<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2e231a; touch-action: none; }
    #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #2e231a; }
    #loader { position: fixed; left: 50%; top: 50%; width: 60%; max-width: 320px; transform: translate(-50%, -50%); text-align: center;
      font: bold 18px sans-serif; color: #f0e6d6; }
    #bar { margin-top: 12px; height: 14px; border-radius: 7px; background: #4a3829; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #4fb35a; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">Замок из сундуков<div id="bar"><div id="fill"></div></div></div>
  <script>
    // Full-window canvas for phones and the Yandex Games frame; the game lays itself out for any aspect.
    var canvas = document.getElementById("unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Sharp on phones without rendering at full 3x.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loader").remove();
      }).catch(function (e) { alert(e); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
